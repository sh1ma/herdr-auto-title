name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ruff-action は v4 の移動タグを出していないのでパッチまで固定する
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.2"
          args: check --output-format github
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.2"
          args: format --check --diff

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # shellcheck は ubuntu ランナーに同梱されている
      - run: shellcheck install.sh

  compile:
    # ruff.toml の target-version = py39 が実際に守られているかを見る
    name: py39 syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m py_compile herdr_auto_title.py
